name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Nazzelha_v0.5_Android_Source.zip'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
      - 'patches/**'
      - 'ci/**'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [ -f settings.gradle.kts ] && [ -d app ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f Nazzelha_v0.5_Android_Source.zip ]; then
            unzip -q Nazzelha_v0.5_Android_Source.zip -d _source
            test -f _source/Nazzelha_v05/settings.gradle.kts
            echo "dir=_source/Nazzelha_v05" >> "$GITHUB_OUTPUT"
          else
            echo "Upload the Nazzelha v0.5 source project or ZIP to the repository first."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ] || [ ! -x "$SDK/build-tools/35.0.0/aapt2" ]; then
            MANAGER=$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
            test -x "$MANAGER"
            "$MANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/aapt2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply source fixes
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: patch --batch --forward -p1 < "$GITHUB_WORKSPACE/patches/0001-resolve-background-color.patch"
      - name: Assemble debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK signature and alignment
        shell: bash
        run: |
          APK="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-info.txt
          grep -q "package: name='com.clipshelf.app'" apk-info.txt
          grep -q "arm64-v8a" apk-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Nazzelha-arm64-debug-candidate
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  install-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            target: google_apis
            label: api35-standard
            expected_page_size: 0
          - api: 35
            target: google_apis_ps16k
            label: api35-16kb
            expected_page_size: 16384
    name: Install and launch (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Nazzelha-arm64-debug-candidate
          path: candidate
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install and run exact ARM64 APK
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_5
          ram-size: 3072M
          disk-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -gpu swiftshader -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash ci/apk-smoke.sh candidate/app-debug.apk diagnostics ${{ matrix.expected_page_size }}
      - name: Upload diagnostic logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.label }}
          path: diagnostics/
          if-no-files-found: warn
  publish-tested-apk:
    needs: [build, install-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Nazzelha-arm64-debug-candidate
          path: tested
      - uses: actions/upload-artifact@v4
        with:
          name: Nazzelha-arm64-debug-tested
          path: tested/app-debug.apk
          if-no-files-found: error
