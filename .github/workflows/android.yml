name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Nazzelha_v0.5_Android_Source.zip'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
      - 'patches/**'
      - 'ci/**'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [ -f settings.gradle.kts ] && [ -d app ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f Nazzelha_v0.5_Android_Source.zip ]; then
            unzip -q Nazzelha_v0.5_Android_Source.zip -d _source
            test -f _source/Nazzelha_v05/settings.gradle.kts
            echo "dir=_source/Nazzelha_v05" >> "$GITHUB_OUTPUT"
          else
            echo "Upload the Nazzelha v0.5 source project or ZIP to the repository first."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ] || [ ! -x "$SDK/build-tools/35.0.0/aapt2" ]; then
            MANAGER=$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
            test -x "$MANAGER"
            "$MANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/aapt2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply source fixes
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          for fix in "$GITHUB_WORKSPACE"/patches/*.patch; do
            patch --batch --forward -p1 < "$fix"
          done
      - name: Install app updater source
        run: python3 ci/install-updater.py "${{ steps.project.outputs.dir }}"
      - name: Assemble debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle :app:assembleDebug --stacktrace
      - name: Sign with persistent update key when configured
        id: sign
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.NAZZELHA_SIGNING_KEY_B64 }}
          SIGNING_PASSWORD: ${{ secrets.NAZZELHA_SIGNING_PASSWORD }}
        run: |
          if [[ -z "$SIGNING_KEY" && -z "$SIGNING_PASSWORD" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No persistent signing key configured; test debug build only. No update release will be published."
            exit 0
          fi
          test -n "$SIGNING_KEY" && test -n "$SIGNING_PASSWORD"
          umask 077
          KEY="$(mktemp)"
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 -d > "$KEY"
          APK="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEY" --ks-type PKCS12 --ks-key-alias nazzelha --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD --out "$APK.signed" "$APK"
          mv "$APK.signed" "$APK"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Verify APK signature and alignment
        shell: bash
        run: |
          APK="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-info.txt
          grep -q "package: name='com.clipshelf.app'" apk-info.txt
          grep -q "arm64-v8a" apk-info.txt
      - name: Generate update manifest from actual APK
        run: python3 ci/update-manifest.py "${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" "$ANDROID_HOME/build-tools/35.0.0/aapt" "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - uses: actions/upload-artifact@v4
        with:
          name: Nazzelha-arm64-debug-candidate
          path: |
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/update.json
          if-no-files-found: error

  install-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            target: google_apis
            label: api35-standard
            expected_page_size: 0
          - api: 35
            target: google_apis_ps16k
            label: api35-16kb
            expected_page_size: 16384
    name: Install and launch (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Nazzelha-arm64-debug-candidate
          path: candidate
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install and run exact ARM64 APK
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          disk-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -cores 2 -no-window -no-snapshot -gpu swiftshader -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash ci/apk-smoke.sh candidate/app-debug.apk diagnostics ${{ matrix.expected_page_size }}
      - name: Upload diagnostic logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.label }}
          path: diagnostics/
          if-no-files-found: warn
  publish-tested-apk:
    needs: [build, install-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Nazzelha-arm64-debug-candidate
          path: tested
      - uses: actions/upload-artifact@v4
        with:
          name: Nazzelha-arm64-debug-tested
          path: |
            tested/app-debug.apk
            tested/update.json
          if-no-files-found: error

  release-update:
    needs: [build, publish-tested-apk]
    if: ${{ github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Nazzelha-arm64-debug-tested
          path: release
      - name: Publish signed and tested public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd release
          mv app-debug.apk Nazzelha-arm64.apk
          TAG="$(python3 -c 'import json; print("v" + json.load(open("update.json"))["versionName"])')"
          EXPECTED="$(python3 -c 'import json; print(json.load(open("update.json"))["sha256"])')"
          echo "$EXPECTED  Nazzelha-arm64.apk" | sha256sum -c -
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists. Bump the app version before publishing another update."
            exit 1
          fi
          # Compare with the previous published signer before creating a release.
          if gh release view --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            mkdir -p previous
            gh release download --repo "$GITHUB_REPOSITORY" --pattern update.json --dir previous
            python3 -c 'import json; a=json.load(open("previous/update.json")); b=json.load(open("update.json")); assert a["signerSha256"] == b["signerSha256"], "Signing certificate changed"; assert b["versionCode"] > a["versionCode"], "Version code must increase"'
          fi
          gh release create "$TAG" Nazzelha-arm64.apk update.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Nazzelha $TAG" --generate-notes --draft
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
